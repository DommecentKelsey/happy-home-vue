schema: spec-driven

context: |
  UI source of truth is the Figma file "Happy home oefening (Copy)"
  (https://www.figma.com/design/51H4tR0niHvMaoocYY3M8g): screens on "Page 1"
  (Code / Loading / Error / Expired code / Server error, desktop 1280x832 and
  mobile 390x844, each in Light, Dark and High contrast) and components, text
  styles and the "Theme" color variables on the "Design System" page.
  CSS custom properties must use the Figma variable code syntax
  (e.g. var(--color-primary)).
  The backend endpoint for the access code is not available yet and will be
  provided later; keep all request/response handling isolated so it can be
  swapped without touching UI components.

